$('connect').onclick=async()=>{busy(true);status('正在读取项目分支，无需克隆工程…');try{const d=await api('/api/connect',{method:'POST',body:JSON.stringify({url:$('url').value.trim(),allowInsecure:$('allowHttp').checked})});session=d.id;cacheAddress($('url').value.trim());landingEpoch++;boardEpoch++;boardCommits=[];boardPage=0;boardHasMore=false;$('landingCommit').value='';$('landingList').replaceChildren();$('landingSummary').textContent='请选择一条提交。';$('landingHistory').replaceChildren();$('landingHistorySummary').textContent='切换到看板后加载分支提交。';const branchSelect=$('landingBranch');branchSelect.replaceChildren();for(const branch of d.branches){const option=document.createElement('option');option.value=branch;option.textContent=branch;branchSelect.append(option)}branchSelect.value=['master','main'].find(x=>d.branches.includes(x))||d.branches[0]||'';resetDiff();clearQueue();confirmedEmpty.clear();document.body.classList.add('repo-connected');preStatus.classList.add('hidden');optionize(d.branches);$('disconnect').classList.remove('hidden');$('url').disabled=true;status(`已连接，找到 ${d.branches.length} 个分支。正在加载提交…`,'ok');await loadTargetStatus();await loadCommits();await loadOperations();if(document.body.classList.contains('view-landings'))await loadBoardCommits(1)}catch(e){status(e.message,'err')}finally{busy(false)}};
$('disconnect').onclick=async()=>{try{await api('/api/disconnect',{method:'POST'})}catch{}session='';location.reload()};
$('load').onclick=async()=>{busy(true);status('正在读取选中提交的代码差异…');try{const d=await api(`/api/diff?target=${encodeURIComponent($('target').value)}&source=${encodeURIComponent($('source').value)}&commit=${encodeURIComponent($('commit').value)}`);files=d.files;fingerprint=d.fingerprint;checkState=null;showCheckState('未检查');document.body.classList.add('commit-selected');$('search').disabled=false;render();status(`已加载该提交中 ${files.length} 个文件的差异。点击“检查整条提交”确认是否可应用。`,'ok');document.querySelector('.toolbar').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){status(e.message,'err')}finally{busy(false)}};
$('search').oninput=render;
$('check').onclick=async()=>{busy(true);status('正在由 GitLab 服务端试遴选整条提交…');const target=$('target').value,commit=$('commit').value;try{await api('/api/check',{method:'POST',body:JSON.stringify(payload())});checkState={target,commit,fingerprint};showCheckState('可应用','ok');status('GitLab 检查通过，整条提交可应用到目标分支。','ok')}catch(e){checkState=null;if(e.code==='already_applied'){confirmedEmpty.add(emptyKey(target,commit));resetDiff();$('commit').value='';renderHistory();status(`这条提交在 ${target} 上试遴选得到空改动，可能已包含或被后续提交覆盖。已从来源独有列表隐藏；关闭右上角筛选仍可查看。`,'ok')}else{showCheckState(e.code==='conflict'?'冲突':'检查失败','err');status(e.message,'err')}}finally{busy(false);updateCount()}};
$('create').onclick=async()=>{const target=$('target').value,commit=$('commit').value;if(!confirm(`将选中的整条提交直接写入远端目标分支 ${target}。确认继续？`))return;busy(true);status(`正在由 GitLab 将整条提交遴选到 ${target}…`);try{const d=await api('/api/create',{method:'POST',body:JSON.stringify(payload())});confirmedEmpty.add(emptyKey(target,commit));queue=queue.filter(id=>id!==commit);renderQueue();resetDiff();$('commit').value='';renderHistory();status(`遴选成功：远端 ${d.target} 已生成提交 ${d.commit}${d.recordSaved?'':'；操作记录保存失败'}${d.webUrl?'\n'+d.webUrl:''}`,'ok');await loadOperations()}catch(e){checkState=null;if(e.code==='already_applied'){confirmedEmpty.add(emptyKey(target,commit));resetDiff();$('commit').value='';renderHistory();status(`这条提交在 ${target} 上试遴选得到空改动，可能已包含或被后续提交覆盖。已从来源独有列表隐藏。`,'ok')}else{showCheckState(e.code==='conflict'?'冲突':'需要重新检查','err');status(e.message,'err')}await loadOperations()}finally{busy(false);updateCount()}};
$('batchCreate').onclick=async()=>{
  if(!queue.length||!canPushTarget)return;
  const target=$('target').value,source=$('source').value,commits=[...queue];
  if(!confirm(`将按队列顺序把 ${commits.length} 条提交遴选到远端 ${target}。每条成功后立即写入；后续失败不会撤销此前成功的提交。确认继续？`))return;
  clearSingleStatus();batchRunning=true;renderQueue();renderHistory();busy(true);$('batchStatus').className='status info';$('batchStatus').textContent=`正在逐条检查并遴选 ${commits.length} 条提交…`;
  try{
    const d=await api('/api/batch',{method:'POST',body:JSON.stringify({mode:'gitlab-api',target,source,commits})});
    for(const item of d.completed){confirmedEmpty.add(emptyKey(target,item.sourceCommit));queue=queue.filter(id=>id!==item.sourceCommit)}
    if(d.stopped?.code==='already_applied'){confirmedEmpty.add(emptyKey(target,d.stopped.commit));queue=queue.filter(id=>id!==d.stopped.commit)}
    if(d.completed.length){resetDiff();$('commit').value=''}
    renderQueue();renderHistory();
    const completed=d.completed.map(x=>`${x.sourceCommit.slice(0,8)} → ${x.resultCommit.slice(0,8)}`).join('；');
    const unsaved=d.completed.filter(x=>!x.recordSaved).length;
    const message=(d.stopped?`已成功 ${d.completed.length}/${commits.length} 条${completed?'：'+completed:''}。第 ${d.stopped.index+1} 条 ${d.stopped.commit.slice(0,8)} 停止：${d.stopped.error}。后续 ${d.remaining.length} 条未执行；已成功的提交不会自动撤销。`:`全部 ${d.completed.length} 条遴选成功：${completed}`)+(unsaved?`其中 ${unsaved} 条操作记录保存失败，请在 GitLab 核对。`:'');
    $('batchStatus').className='status '+(d.stopped?'err':'ok');$('batchStatus').textContent=message;
    await loadTargetStatus();await loadOperations();
  }catch(e){$('batchStatus').className='status err';$('batchStatus').textContent=`批量请求失败：${e.message}。如请求曾中断，请先查看目标分支和操作记录，确认结果后再重试。`}
  finally{batchRunning=false;renderQueue();renderHistory();busy(false)}
};
authStatus();
</script></body></html>
